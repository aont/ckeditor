name: Deploy GitHub Pages (public)

on:
  push:
    branches: ["main"]
    # Deploy only when changes occur in public/ (skip condition)
    paths:
      - "public/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download CKEditor5 zip
        run: |
          curl -L -o ckeditor5-47.4.0.zip https://cdn.ckeditor.com/ckeditor5/47.4.0/zip/ckeditor5-47.4.0.zip

      - name: Unzip CKEditor5 into public/
        run: |
          unzip -o ckeditor5-47.4.0.zip -d public

      # Upload public/ as-is as the Pages site artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
