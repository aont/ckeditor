<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CKEditor 5 Debug RTE</title>

  <link rel="stylesheet" href="./ckeditor5/ckeditor5.css" />
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans JP", sans-serif;
      margin: 0;
      background: #f6f7f9;
    }

    header {
      padding: 12px 16px;
      background: #fff;
      border-bottom: 1px solid #e6e8ee;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    header h1 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
    }

    #status {
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid #d7dbe6;
      background: #fff;
    }

    .wrap {
      padding: 12px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: #fff;
      border: 1px solid #e6e8ee;
      border-radius: 10px;
      box-shadow: 0 1px 2px rgba(0,0,0,.03);
      overflow: hidden;
      margin-bottom: 12px;
    }

    .card h2 {
      margin: 0;
      padding: 10px 12px;
      font-size: 12px;
      border-bottom: 1px solid #e6e8ee;
      color: #333;
    }

    .card .content {
      padding: 12px;
    }

    #editor {
      min-height: 320px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    button {
      border: 1px solid #d7dbe6;
      background: #fff;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
    }

    button.primary {
      background: #111827;
      border-color: #111827;
      color: #fff;
    }

    button.danger {
      border-color: #ef4444;
      color: #b91c1c;
    }

    textarea {
      width: 100%;
      min-height: 200px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Courier New", monospace;
      font-size: 12px;
    }

    iframe {
      width: 100%;
      min-height: 240px;
      border: 1px solid #e6e8ee;
      border-radius: 8px;
      background: #fff;
    }

    .hint {
      font-size: 12px;
      color: #667085;
      line-height: 1.5;
      margin-top: 8px;
    }
  </style>
</head>
<body>
<header>
  <h1>CKEditor 5 Debug RTE</h1>
  <div id="status">Status: booting...</div>
</header>

<div class="wrap">
  <!-- Editor -->
  <section class="card">
    <h2>Editor</h2>
    <div class="content">
      <div class="actions">
        <button id="btnSave" class="primary">保存（localStorage）</button>
        <button id="btnLoad">読込（localStorage）</button>
        <button id="btnToHtml">HTMLへ反映（下）</button>
        <button id="btnClear" class="danger">クリア</button>
      </div>

      <div id="editor">
        <p>ここに入力できれば初期化は成功です。</p>
      </div>

      <p class="hint">
        入力できない場合は DevTools Console を確認してください（licenseKey 不備が最多）。
      </p>
    </div>
  </section>

  <!-- HTML Text -->
  <section class="card">
    <h2>HTML</h2>
    <div class="content">
      <div class="actions">
        <button id="btnCopy">HTMLをコピー</button>
        <button id="btnDownload">HTMLをダウンロード</button>
        <button id="btnFromHtml">エディタへ読み込み</button>
      </div>

      <textarea id="htmlOutput" placeholder="ここに editor.getData() を表示します"></textarea>
    </div>
  </section>

  <!-- Preview -->
  <section class="card">
    <h2>Preview</h2>
    <div class="content">
      <iframe id="htmlPreview" sandbox="allow-same-origin"></iframe>
    </div>
  </section>
</div>

<script src="./ckeditor5/ckeditor5.umd.js"></script>

<script>
  const $ = (sel) => document.querySelector(sel);
  const statusEl = $('#status');

  function setStatus(text) {
    statusEl.textContent = 'Status: ' + text;
  }

  const LICENSE_KEY = 'GPL';
  const STORAGE_KEY = 'rte:ckeditor5:content:v1';
  const AUTOSAVE_DEBOUNCE_MS = 700;

  let editor;

  function debounce(fn, ms) {
    let t;
    return (...args) => {
      clearTimeout(t);
      t = setTimeout(() => fn(...args), ms);
    };
  }

  function updatePreview(html) {
    const iframe = $('#htmlPreview');
    const doc = iframe.contentDocument || iframe.contentWindow.document;
    doc.open();
    doc.write(html);
    doc.close();
  }

  function saveToStorage() {
    if (!editor) return;
    localStorage.setItem(STORAGE_KEY, editor.getData());
  }

  function loadFromStorage() {
    const data = localStorage.getItem(STORAGE_KEY);
    if (data && editor) editor.setData(data);
  }

  function clearAll() {
    localStorage.removeItem(STORAGE_KEY);
    $('#htmlOutput').value = '';
    updatePreview('');
    if (editor) editor.setData('<p></p>');
  }

  function toHtmlPanel() {
    if (!editor) return;
    const html = editor.getData();
    $('#htmlOutput').value = html;
    updatePreview(html);
  }

  function fromHtmlPanel() {
    if (!editor) return;
    const html = $('#htmlOutput').value || '<p></p>';
    editor.setData(html);
    updatePreview(html);
  }

  function downloadHtml(filename, content) {
    const blob = new Blob([content], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
  }

  const autosave = debounce(saveToStorage, AUTOSAVE_DEBOUNCE_MS);

  (async () => {
    try {
      setStatus('loading');

      const {
        ClassicEditor,
        Essentials,
        Paragraph,
        Bold,
        Italic,
        Heading,
        Link,
        List
      } = CKEDITOR;

      editor = await ClassicEditor.create($('#editor'), {
        licenseKey: LICENSE_KEY,
        plugins: [Essentials, Paragraph, Bold, Italic, Heading, Link, List],
        toolbar: [
          'undo', 'redo', '|',
          'heading', '|',
          'bold', 'italic', '|',
          'link', 'bulletedList', 'numberedList'
        ]
      });

      setStatus('ready');
      loadFromStorage();
      toHtmlPanel();

      editor.model.document.on('change:data', () => {
        autosave();
      });

    } catch (err) {
      setStatus('init failed');
      console.error(err);
      alert('CKEditor の初期化に失敗しました。');
    }
  })();

  $('#btnSave').addEventListener('click', saveToStorage);
  $('#btnLoad').addEventListener('click', loadFromStorage);
  $('#btnToHtml').addEventListener('click', toHtmlPanel);
  $('#btnClear').addEventListener('click', clearAll);
  $('#btnFromHtml').addEventListener('click', fromHtmlPanel);

  $('#btnCopy').addEventListener('click', async () => {
    toHtmlPanel();
    await navigator.clipboard.writeText($('#htmlOutput').value || '');
  });

  $('#btnDownload').addEventListener('click', () => {
    toHtmlPanel();
    downloadHtml('content.html', $('#htmlOutput').value || '');
  });

  $('#htmlOutput').addEventListener('input', (e) => {
    updatePreview(e.target.value);
  });
</script>
</body>
</html>
